<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: 안드로이드 Chrome 108+ 는 iOS 처럼 visual viewport 만 줄이는 게
         기본(resizes-visual)이라 키바가 키보드에 가려질 수 있다 — 레이아웃 뷰포트까지 줄여
         flex 레이아웃이 스스로 맞게 한다(iOS 는 이 키를 무시하고 mobile.ts 의 visualViewport 처리가 담당). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="터미널" />
    <meta name="theme-color" content="#1e1e20" />
    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 열린다 (토큰은 쿠키에 남아 QR 재촬영 불필요) -->
    <!-- 상대 경로 — 이 페이지는 `/terminal/` 아래에서 서빙된다 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>One App 터미널</title>
    <!-- 첫 페인트용 크리티컬 CSS — mobile.css 는 mobile.ts 가 import 하므로 **dev 모드에선
         JS 실행 후에야 주입**되고, 그 사이 흰 배경·정렬 안 된 바가 한 프레임 보인다(FOUC).
         prod 빌드는 Vite 가 head 에 <link> 를 넣어 대체로 없지만, 두 모드 모두 첫 프레임부터
         다크 골격이 잡히도록 최소 규칙만 여기 둔다(정본은 mobile.css). -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1e1e20;
        color: #e8e8ea;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #topbar,
      #keybar {
        background: #29292c;
        flex-shrink: 0;
      }
      #term {
        flex: 1;
        min-height: 0;
      }
      #cwdSheet[hidden] {
        display: none;
      }
    </style>
    <script type="module" src="/mobile.ts"></script>
  </head>
  <body>
    <!-- 좁은 화면이라 조작은 전부 버튼 하나 + 바텀시트로. 글자 크기는 두 손가락 핀치가 맡는다.
         ⚠️ 아이콘은 **앱과 같은 Lucide SVG**(renderer/components/Icon.tsx 와 같은 path)다 —
            예전엔 ≡ ＋ ± ✕ 처럼 문자 글리프를 썼는데 전각/반각·굵기가 제각각이라 같은
            30×30 박스 안에서도 크기가 중구난방으로 보였다(2026-08-08 사용자 지적).
            SVG 면 viewBox·stroke-width 가 같아 시각 무게가 정확히 맞는다.
         ⚠️ 순서는 자주 쓰는 것부터 왼쪽: 새 세션 → 변경사항 → 종료. -->
    <header id="topbar">
      <button id="navBtn" type="button" aria-label="작업 영역 선택">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5" />
          <circle cx="13" cy="12" r="2" />
          <path d="M18 19c-2.8 0-5-2.2-5-5v8" />
          <circle cx="20" cy="19" r="2" />
        </svg>
      </button>
      <select id="sessionSelect" aria-label="세션 선택"></select>
      <!-- 새 세션 = 셸 + 프리셋 (예전엔 ⚡ 가 따로 있었는데 결국 '무엇으로 시작할까'라는
           같은 질문이라 한 버튼으로 합쳤다) -->
      <button id="newBtn" type="button" aria-label="새 세션">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      </button>
      <!-- 지금 작업 중인 영역의 git 변경사항 — 터미널에서 바로 띄운다.
           ⚠️ 조건부로 감추지 말 것: 세션에 붙어 있을 때만 보이게 했더니 "버튼이 없다"가
           됐다(2026-08-08). 작업 영역만 골라 둬도 볼 수 있으므로 항상 띄운다. -->
      <button id="changesBtn" type="button" aria-label="변경사항">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="6" x2="6" y1="3" y2="15" />
          <circle cx="18" cy="6" r="3" />
          <circle cx="6" cy="18" r="3" />
          <path d="M18 9a9 9 0 0 1-9 9" />
        </svg>
      </button>
      <!-- 보고 있는 세션 종료 — 붙어 있는 세션이 있을 때만 나타난다 -->
      <button id="closeBtn" type="button" hidden aria-label="현재 세션 종료">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <!-- 입력 대기 세션 바로가기 — 대기가 있을 때만 나타난다.
           숫자는 아이콘 위에 겹치는 배지라 버튼 폭이 다른 것과 같게 유지된다 -->
      <button id="waitBtn" type="button" hidden aria-label="입력 대기 세션으로 이동">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        <span id="waitCount"></span>
      </button>
      <span id="status">연결 중…</span>
    </header>
    <!-- 선택된 작업 영역 — 세션이 그 위치 것만 걸러지고 새 세션·프리셋도 여기서 열린다 -->
    <div id="scope" hidden></div>
    <main id="term">
      <button id="toBottom" type="button" hidden aria-label="맨 아래로">↓ 맨 아래로</button>
      <!-- 핀치 중에만 잠깐 뜨는 글자 크기 표시 (버튼이 없어졌으므로 현재 값을 알 방법) -->
      <div id="fontHud" hidden aria-hidden="true"></div>
    </main>
    <!-- 공용 바텀시트 — 작업 영역 트리 · 새 세션 위치/에이전트 · 프리셋이 돌려 쓴다 -->
    <div id="cwdSheet" hidden>
      <div id="cwdBackdrop"></div>
      <div id="cwdPanel">
        <div id="cwdTitle">새 세션 위치</div>
        <div id="cwdList"></div>
      </div>
    </div>
    <!-- 키바는 입력할 때만 필요하다 — 소프트 키보드가 떠서 뷰포트가 줄어든 동안만
         펼쳐진다(mobile.ts 의 keyboardOpen·syncKeybar. 고정 토글 ⌨ 는 2026-08-08 제거).
         붙여넣기는 폰에서 xterm 에 클립보드를 넣을 유일한 경로라 여기 둔다. -->
    <!-- 변경사항 전체화면 — ± 를 누르면 **바로** 이 화면이 뜬다(중간 목록 단계 없음).
         파일 행을 탭하면 그 자리에서 diff 가 펼쳐져, 스크롤 한 번으로 전체를 훑을 수 있다. -->
    <div id="chgView" hidden>
      <header id="chgBar">
        <button id="chgClose" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <span id="chgBranch"></span>
        <span id="chgAhead"></span>
        <button id="chgPush" type="button" hidden>푸시</button>
      </header>
      <div id="chgBody"></div>
    </div>
    <footer id="keybar">
      <button type="button" data-key="esc">esc</button>
      <button type="button" data-key="tab">tab</button>
      <button type="button" data-key="shift-tab">⇧tab</button>
      <button type="button" data-key="ctrl" id="ctrlBtn">ctrl</button>
      <button type="button" data-key="up">↑</button>
      <button type="button" data-key="down">↓</button>
      <button type="button" data-key="left">←</button>
      <button type="button" data-key="right">→</button>
      <button type="button" data-key="enter">⏎</button>
      <button type="button" data-key="paste" id="pasteBtn" aria-label="붙여넣기">📋</button>
    </footer>
  </body>
</html>
