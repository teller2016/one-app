<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: 안드로이드 Chrome 108+ 는 iOS 처럼 visual viewport 만 줄이는 게
         기본(resizes-visual)이라 키바가 키보드에 가려질 수 있다 — 레이아웃 뷰포트까지 줄여
         flex 레이아웃이 스스로 맞게 한다(iOS 는 이 키를 무시하고 mobile.ts 의 visualViewport 처리가 담당). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="터미널" />
    <meta name="theme-color" content="#1e1e20" />
    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 열린다 (토큰은 쿠키에 남아 QR 재촬영 불필요) -->
    <!-- 상대 경로 — 이 페이지는 `/terminal/` 아래에서 서빙된다 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>One App 터미널</title>
    <!-- 첫 페인트용 크리티컬 CSS — mobile.css 는 mobile.ts 가 import 하므로 **dev 모드에선
         JS 실행 후에야 주입**되고, 그 사이 흰 배경·정렬 안 된 바가 한 프레임 보인다(FOUC).
         prod 빌드는 Vite 가 head 에 <link> 를 넣어 대체로 없지만, 두 모드 모두 첫 프레임부터
         다크 골격이 잡히도록 최소 규칙만 여기 둔다(정본은 mobile.css). -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1e1e20;
        color: #e8e8ea;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #topbar,
      #keybar {
        background: #29292c;
        flex-shrink: 0;
      }
      #term {
        flex: 1;
        min-height: 0;
      }
      #cwdSheet[hidden] {
        display: none;
      }
    </style>
    <script type="module" src="/mobile.ts"></script>
  </head>
  <body>
    <!-- 좁은 화면이라 조작은 전부 버튼 하나 + 바텀시트로 — 작업 영역(≡)·프리셋(⚡).
         글자 크기는 버튼 대신 두 손가락 핀치가 맡는다(툴바 두 칸 회수). -->
    <header id="topbar">
      <button id="navBtn" type="button" aria-label="작업 영역 선택">≡</button>
      <select id="sessionSelect" aria-label="세션 선택"></select>
      <!-- 이 세션 위치의 git 변경사항 — 붙어 있는 세션이 있을 때만 나타난다 -->
      <button id="changesBtn" type="button" hidden aria-label="변경사항">±</button>
      <!-- 보고 있는 세션 종료 — 붙어 있는 세션이 있을 때만 나타난다 -->
      <button id="closeBtn" type="button" hidden aria-label="현재 세션 종료">✕</button>
      <!-- 새 세션 = 셸 + 프리셋 (예전엔 ⚡ 가 따로 있었는데 결국 '무엇으로 시작할까'라는
           같은 질문이라 한 버튼으로 합쳤다 — 툴바 한 칸도 돌려받았다) -->
      <button id="newBtn" type="button" aria-label="새 세션">＋</button>
      <!-- U+2328 은 텍스트 표현이 기본이라 글리프가 없으면 두부(□)로 뜬다 — VS16(️)을
           붙여 이모지 표현으로 강제한다(실측: 붙이기 전 Chromium 에서 깨짐) -->
      <button id="kbBtn" type="button" aria-label="키바 고정">⌨️</button>
      <!-- 입력 대기 세션 바로가기 — 대기가 있을 때만 나타난다 -->
      <button id="waitBtn" type="button" hidden aria-label="입력 대기 세션으로 이동"></button>
      <span id="status">연결 중…</span>
    </header>
    <!-- 선택된 작업 영역 — 세션이 그 위치 것만 걸러지고 새 세션·프리셋도 여기서 열린다 -->
    <div id="scope" hidden></div>
    <main id="term">
      <button id="toBottom" type="button" hidden aria-label="맨 아래로">↓ 맨 아래로</button>
      <!-- 핀치 중에만 잠깐 뜨는 글자 크기 표시 (버튼이 없어졌으므로 현재 값을 알 방법) -->
      <div id="fontHud" hidden aria-hidden="true"></div>
    </main>
    <!-- 공용 바텀시트 — 작업 영역 트리 · 새 세션 위치/에이전트 · 프리셋이 돌려 쓴다 -->
    <div id="cwdSheet" hidden>
      <div id="cwdBackdrop"></div>
      <div id="cwdPanel">
        <div id="cwdTitle">새 세션 위치</div>
        <div id="cwdList"></div>
      </div>
    </div>
    <!-- 키바는 입력할 때만 필요하다 — 기본은 터미널에 포커스가 있을 때만 펼쳐지고,
         ⌨ 버튼으로 고정할 수 있다(mobile.ts). 붙여넣기는 폰에서 xterm 에 클립보드를
         넣을 유일한 경로라 여기 둔다. -->
    <!-- diff 전체화면 — 코드는 가로가 생명이라 폰에서는 화면을 통째로 쓴다.
         목록(바텀시트)에서 파일을 탭하면 열리고 ‹ 로 돌아간다. -->
    <div id="diffView" hidden>
      <header id="diffBar">
        <button id="diffBack" type="button" aria-label="목록으로">‹</button>
        <span id="diffPath"></span>
      </header>
      <pre id="diffBody"></pre>
    </div>
    <footer id="keybar">
      <button type="button" data-key="esc">esc</button>
      <button type="button" data-key="tab">tab</button>
      <button type="button" data-key="shift-tab">⇧tab</button>
      <button type="button" data-key="ctrl" id="ctrlBtn">ctrl</button>
      <button type="button" data-key="up">↑</button>
      <button type="button" data-key="down">↓</button>
      <button type="button" data-key="left">←</button>
      <button type="button" data-key="right">→</button>
      <button type="button" data-key="enter">⏎</button>
      <button type="button" data-key="paste" id="pasteBtn" aria-label="붙여넣기">📋</button>
    </footer>
  </body>
</html>
